<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Banner: Transformando dados em decisões. Python, SQL e Power BI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
    <style>
      .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 1.2s ease-out both; }
      .b1{animation-delay:.05s}.b2{animation-delay:.15s}.b3{animation-delay:.25s}.b4{animation-delay:.35s}
      .b5{animation-delay:.45s}.b6{animation-delay:.55s}.b7{animation-delay:.65s}
      @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      .line { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.6s .4s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <!-- Fundo -->
  <rect x="1" y="1" width="998" height="358" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="358" rx="16" fill="url(#dots)" opacity="0.6"/>

  <!-- Texto -->
  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="60" y="130" font-size="42" font-weight="700" fill="#f0f6fc">Transformando dados</text>
    <text x="60" y="182" font-size="42" font-weight="700" fill="url(#accent)">em decisões.</text>
    <text x="60" y="226" font-size="18" fill="#8b949e">Análise de Dados · Insights · Visualização</text>

    <!-- Pills -->
    <g font-size="14" font-weight="600" text-anchor="middle">
      <rect x="60" y="254" width="88" height="34" rx="17" fill="#1f2a3a" stroke="#58a6ff" stroke-opacity="0.5"/>
      <text x="104" y="276" fill="#79c0ff">Python</text>
      <rect x="158" y="254" width="64" height="34" rx="17" fill="#1f2a3a" stroke="#58a6ff" stroke-opacity="0.5"/>
      <text x="190" y="276" fill="#79c0ff">SQL</text>
      <rect x="232" y="254" width="104" height="34" rx="17" fill="#2a2614" stroke="#f2c811" stroke-opacity="0.5"/>
      <text x="284" y="276" fill="#f2c811">Power BI</text>
    </g>
  </g>

  <!-- Mini dashboard -->
  <rect x="540" y="40" width="400" height="280" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="560" cy="62" r="5" fill="#ff5f56"/>
  <circle cx="578" cy="62" r="5" fill="#ffbd2e"/>
  <circle cx="596" cy="62" r="5" fill="#27c93f"/>

  <!-- KPIs -->
  <g>
    <rect x="556" y="86" width="116" height="52" rx="8" fill="#0d1117" stroke="#30363d"/>
    <rect x="570" y="100" width="40" height="6" rx="3" fill="#484f58"/>
    <rect x="570" y="116" width="70" height="12" rx="4" fill="#58a6ff"/>

    <rect x="683" y="86" width="116" height="52" rx="8" fill="#0d1117" stroke="#30363d"/>
    <rect x="697" y="100" width="40" height="6" rx="3" fill="#484f58"/>
    <rect x="697" y="116" width="56" height="12" rx="4" fill="#3fb950"/>

    <rect x="810" y="86" width="116" height="52" rx="8" fill="#0d1117" stroke="#30363d"/>
    <rect x="824" y="100" width="40" height="6" rx="3" fill="#484f58"/>
    <rect x="824" y="116" width="64" height="12" rx="4" fill="#f2c811"/>
  </g>

  <!-- Linhas de grade -->
  <g stroke="#30363d" stroke-width="1" stroke-dasharray="3 4">
    <line x1="556" y1="200" x2="926" y2="200"/>
    <line x1="556" y1="245" x2="926" y2="245"/>
  </g>
  <line x1="556" y1="290" x2="926" y2="290" stroke="#484f58" stroke-width="1.5"/>

  <!-- Gráfico de barras -->
  <g fill="#58a6ff">
    <rect class="bar b1" x="562" y="250" width="18" height="40" rx="3" opacity="0.75"/>
    <rect class="bar b2" x="588" y="235" width="18" height="55" rx="3" opacity="0.75"/>
    <rect class="bar b3" x="614" y="242" width="18" height="48" rx="3" opacity="0.75"/>
    <rect class="bar b4" x="640" y="220" width="18" height="70" rx="3" opacity="0.75"/>
    <rect class="bar b5" x="666" y="228" width="18" height="62" rx="3" opacity="0.75"/>
    <rect class="bar b6" x="692" y="205" width="18" height="85" rx="3" opacity="0.85"/>
    <rect class="bar b7" x="718" y="190" width="18" height="100" rx="3" fill="#3fb950"/>
  </g>

  <!-- Gráfico de linha -->
  <polygon points="765,290 765,268 790,255 815,262 840,235 865,225 893,205 926,182 926,290" fill="url(#area)"/>
  <polyline class="line" points="765,268 790,255 815,262 840,235 865,225 893,205 926,182" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0d1117" stroke="#58a6ff" stroke-width="2">
    <circle cx="790" cy="255" r="3.5"/>
    <circle cx="840" cy="235" r="3.5"/>
    <circle cx="893" cy="205" r="3.5"/>
  </g>
  <circle cx="926" cy="182" r="5" fill="#3fb950" stroke="#0d1117" stroke-width="2"/>
</svg>
